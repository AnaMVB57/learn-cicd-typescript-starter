name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
        - name: Check out code
          uses: actions/checkout@v4

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: 22

        - name: Install dependencies
          run: npm ci

        - name: Build application
          run: npm run build

        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v3'

        - name: 'Use gcloud CLI'
          run: 'gcloud info'

        - name: Build Docker image & push to Google Artifact Registry
          run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-496619/notely-ar-repo/notely:latest .

        - name: Deploy to Cloud Run
          run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-496619/notely-ar-repo/notely@sha256:760be15850d66fde12d7ec4ec4401d7fcbf816536c4e84c6db6b33ee736aa450 --region us-central1 --allow-unauthenticated --project notely-496619 --max-instances=4